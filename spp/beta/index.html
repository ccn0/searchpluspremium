    <script>
        const params = new URLSearchParams(window.location.search);
        const query = params.get("q");
        const menus = ["home","about","settings","engines"]
        if (query != null) {
            document.querySelector("#q").value = query;
        };
        function displayMenu(menuid) {
            document.querySelectorAll(".menu").forEach((menu)=>{
                menu.classList.remove("activemenu");
            });
            if (menus.includes(menuid)) {
                document.querySelector(`.menu[data-mid="${menuid}"]`).classList.add("activemenu")
            } else {
                document.querySelector(`.menu[data-mid="home"]`).classList.add("activemenu");
            };
